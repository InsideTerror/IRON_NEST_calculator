    <style>

    .calibration-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;padding:18px}.calibration-grid label{display:grid;grid-template-columns:80px 1fr;align-items:center;gap:8px;color:#607b65;font-size:9px}.calibration-grid input{padding:8px;font-size:11px}.calibration-actions{padding:0 18px 18px;display:flex;gap:8px}.calibration-actions button{background:#152119;border:1px solid #3c5a43;color:#9eb29b;padding:8px 12px;font-size:9px;cursor:pointer}.calibration-note{padding:0 18px 14px;color:#607b65;font-size:9px;line-height:1.5}

    :root{--steel:#18211b;--steel2:#253229;--steel3:#0b100d;--brass:#8f8a61;--brass2:#b8ae78;--glass:#9ab39a;--glow:#8eae8c}

    .rotary-mark b{color:#b8ae78}.rotary-buttons{display:flex;gap:5px}.rotary-buttons button{min-width:38px;height:34px;border:2px solid #606b59;background:#151d17;color:#788975;font-weight:bold;cursor:pointer;box-shadow:inset 0 0 7px #000}.rotary-buttons button.active{background:#7f7a55;color:#0b100d;border-color:#c1b982;box-shadow:0 0 12px #b8ae7844,inset 0 1px #eee2a3}

<body>
<div id="app"></div>
<script>
    // IRON NEST FIRING COMPUTER v2 - standalone/offline.
    const SHELLS = [
      ['EMPT','Empty',['Testing']],['AP','Armour Piercing shell',['Underground','Fortification','Armoured']],['APHE','Armour Piercing High Explosive',['Armoured','Fortification','Vehicle']],['ATMC','Atomic',['Area denial','Strategic']],
      ['CLMN','High Explosive Scattering Bomb Shell',['Infantry','Area target']],['CYAN','Cyanogen Gas Bomb Shell',['Infantry','Open troops']],['DRIL','Concrete Filled Dummy Shell',['Testing']],['EQKE','Earthquake Shell',['Underground','Fortification']],
      ['FLCH','Flechette Shell',['Infantry','Open troops']],['HCHE','High Capacity High Explosive Shell',['Infantry','Building','Area target']],['HE','High Explosive Shell',['Infantry','Building','General']],['INCN','Incendiary Shell',['Infantry','Building','Flammable']],
      ['LE','Low Grade Low Energy Shell',['General','Testing']],['PCLM','Parachute Delayed Cluster Land Mine shells',['Area denial']],['PHGN','Phosphorus Grenade Shell',['Infantry','Open troops']],['PRPG','Propaganda Shell',['Psychological']],
      ['SMK','Smoke Shell',['Screening','Cover']],['STAR','Parachute Deployed Illumination shell',['Scouting','Night']],['TEAR','Chloroacetophenone Gas Shell',['Infantry','Open troops']],['THRM','Thermal Shell',['Building','Fortification','Flammable']],['WP','White Phosphorus Shell',['Infantry','Building','Flammable']]
    ];
    const TARGET_PRESETS=['Infantry','Armoured','Underground','Fortification','Building','Vehicle','Artillery','Open troops','Area target','Flammable','Scouting','Unknown'];
    const RECOMMEND={
      'Infantry':['FLCH','HCHE','HE'],'Armoured':['APHE','AP'],'Underground':['EQKE','AP'],'Fortification':['EQKE','APHE'],'Building':['HCHE','HE','THRM'],'Vehicle':['APHE','AP'],'Artillery':['APHE','HE'],'Open troops':['FLCH','CYAN','PHGN','TEAR'],'Area target':['CLMN','HCHE'],'Flammable':['INCN','THRM','WP'],'Scouting':['STAR'],'Unknown':['HE']
    };
    const TABLE=[{start:0,end:5,base:0,slope:12},{start:5,end:10,base:30,slope:6},{start:10,end:15,base:40,slope:4},{start:15,end:20,base:45,slope:3},{start:20,end:25,base:48,slope:2.4},{start:25,end:30,base:50,slope:2}];
    let lastResult=null, revealTimer=null;
    let settings=JSON.parse(localStorage.getItem('ironNestSettings')||'{}');
    settings.distanceUnit=settings.distanceUnit||'km'; settings.angleUnit=settings.angleUnit||'deg'; settings.theme=settings.theme||'green'; settings.brightness=settings.brightness??100; settings.keepAwake=settings.keepAwake!==false;
    let history=JSON.parse(localStorage.getItem('ironNestHistory')||'[]');
    const DEFAULT_POINTS=[[0,0],[5,30],[10,40],[15,45],[20,48],[25,50],[30,60]];
    let calibration=JSON.parse(localStorage.getItem('ironNestCalibration')||JSON.stringify(DEFAULT_POINTS));
    if(!Array.isArray(calibration)||calibration.length!==7) calibration=DEFAULT_POINTS.map(x=>x.slice());

    function saveSettings(){localStorage.setItem('ironNestSettings',JSON.stringify(settings));}
    function toKm(v){return settings.distanceUnit==='m'?v/1000:v;}
    function fromKm(v){return settings.distanceUnit==='m'?v*1000:v;}
    function fmtDistance(km){return fromKm(km).toFixed(settings.distanceUnit==='m'?0:2)+' '+settings.distanceUnit.toUpperCase();}
    function degToMils(deg){return deg*6400/360;}
    function fmtAngle(deg){return settings.angleUnit==='mil'?degToMils(deg).toFixed(0)+' mil':deg.toFixed(2)+'°';}
    function rawAngle(deg){return settings.angleUnit==='mil'?degToMils(deg).toFixed(0):deg.toFixed(2);}
    function calculateElevation(distance){
      if(!Number.isFinite(distance)||distance<0||distance>30) throw new Error('Range must be between 0 and 30 km.');
      const points=calibration.slice().sort((a,b)=>a[0]-b[0]);
      if(distance===0)return{charges:1,elevation:points[0][1],band:`${points[0][0]}–${points[1][0]} KM`};
      let i=points.findIndex((p,idx)=>idx<points.length-1&&distance<=points[idx+1][0]);
      if(i<0)i=points.length-2;
      const [x1,y1]=points[i],[x2,y2]=points[i+1];
      const elevation=y1+(distance-x1)*(y2-y1)/(x2-x1);
      return {charges:Math.ceil(distance/5),elevation,band:`${x1}–${x2} KM`};
    }
    function escapeHtml(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
    function shellOptions(selected='HE'){return SHELLS.map(([c,n])=>`<option value="${c}" ${c===selected?'selected':''}>${c} — ${n}</option>`).join('');}
    function targetOptions(selected=''){return TARGET_PRESETS.map(t=>`<option value="${escapeHtml(t)}" ${t===selected?'selected':''}>${escapeHtml(t)}</option>`).join('');}
    function haversine(lat1,lon1,lat2,lon2){const R=6371,r=Math.PI/180,dLat=(lat2-lat1)*r,dLon=(lon2-lon1)*r,a=Math.sin(dLat/2)**2+Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
    function bearingBetween(lat1,lon1,lat2,lon2){const r=Math.PI/180,y=Math.sin((lon2-lon1)*r)*Math.cos(lat2*r),x=Math.cos(lat1*r)*Math.sin(lat2*r)-Math.sin(lat1*r)*Math.cos(lat2*r)*Math.cos((lon2-lon1)*r);return (Math.atan2(y,x)/r+360)%360;}
    function parseCoords(prefix){const latEl=document.querySelector('#'+prefix+'Lat'),lonEl=document.querySelector('#'+prefix+'Lon');const latRaw=latEl?.value.trim(),lonRaw=lonEl?.value.trim();if(latRaw===''&&lonRaw==='')return null;const lat=Number(latRaw),lon=Number(lonRaw);return latRaw!==''&&lonRaw!==''&&Number.isFinite(lat)&&Number.isFinite(lon)&&lat>=-90&&lat<=90&&lon>=-180&&lon<=180?{lat,lon}:null;}
    function applyTheme(){document.body.classList.toggle('night',settings.theme==='night');document.body.classList.toggle('blackout',settings.theme==='blackout');document.documentElement.style.setProperty('--brightness',settings.brightness/100);}
    function keepAwake(){if(settings.keepAwake && 'wakeLock' in navigator) navigator.wakeLock.request('screen').then(w=>window._wakeLock=w).catch(()=>{});}
    function shellRecommendation(target){const codes=RECOMMEND[target]||RECOMMEND.Unknown;return codes.map(c=>`<strong>${c}</strong>`).join(' · ');}
    function renderForm(prefill={}){
      clearTimeout(revealTimer); applyTheme();
      const d=prefill.distance??''; const shell=prefill.shellCode||'HE'; const target=prefill.target||'';
      document.querySelector('#app').innerHTML=`
      <main class="screen input-screen"><div class="scanlines"></div>
      <header class="masthead"><div class="crest">IRON<br><span>NEST</span></div><div><div class="eyebrow">ARTILLERY CONTROL SYSTEM // FIELD MODEL</div><h1>FIRING COMPUTER</h1><p>MARK IV // OFFLINE FIRE CONTROL UNIT</p></div><div class="status"><i></i> SYSTEM READY</div></header>
      <section class="panel instrument input-panel"><div class="panel-title"><span>00</span> GUN SELECTION</div>
      <div class="gun-console"><div><div class="label">TWIN GUN BATTERY // SELECTED PIECE</div><div class="rotary"><div class="rotary-body" id="rotaryBody"></div><div class="rotary-mark"><b>L</b><b>R</b></div><div class="rotary-buttons"><button type="button" data-gun="L" class="${(prefill.gunSide||settings.gunSide||'L')==='L'?'active':''}">L</button><button type="button" data-gun="R" class="${(prefill.gunSide||settings.gunSide||'L')==='R'?'active':''}">R</button></div></div></div><div class="console-strip" style="flex:1"><div><span>SELECTED GUN</span><strong id="selectedGun">${prefill.gunSide||settings.gunSide||'L'} GUN</strong></div><div><span>BATTERY</span><strong>DUAL MOUNT</strong></div></div></div>
      <div class="console-strip"><div><span>UNIT STATUS</span><strong><i class="warning-lamp"></i>READY</strong></div><div><span>FIRE CONTROL</span><strong>OFFLINE</strong></div><div><span>TABLE</span><strong>MARK IV</strong></div><div><span>MAX RANGE</span><strong>30.00 KM</strong></div></div>
      <div class="panel-title"><span>01</span> TARGET DATA</div>
      <div class="grid">
        <label><span>DISTANCE TO TARGET</span><div class="input-wrap"><input id="distance" type="number" min="0" max="${settings.distanceUnit==='m'?30000:30}" step="${settings.distanceUnit==='m'?1:0.01}" value="${d!==''?escapeHtml(settings.distanceUnit==='m'?fromKm(d):d):''}" placeholder="${settings.distanceUnit==='m'?'12310':'12.31'}" inputmode="decimal"><b>${settings.distanceUnit.toUpperCase()}</b></div><small>MAXIMUM EFFECTIVE RANGE // 30.00 KM</small></label>
        <label><span>BEARING TO TARGET <em>OPTIONAL</em></span><div class="input-wrap"><input id="bearing" type="number" min="0" max="360" step="0.1" value="${prefill.bearing??''}" placeholder="157.4" inputmode="decimal"><b>°</b></div><small>0° — 360° // OR CALCULATE FROM COORDINATES</small></label>
        <label><span>ORDNANCE TYPE</span><select id="shell">${shellOptions(shell)}</select><div id="recommend" class="recommend">RECOMMENDED: ${shellRecommendation(target)}</div></label>
        <label><span>TYPE OF TARGET</span><select id="targetPreset"><option value="">CUSTOM / SELECT</option>${targetOptions(target)}</select><input id="target" type="text" maxlength="60" value="${escapeHtml(target)}" placeholder="e.g. armoured bunker" autocomplete="off"><small>TARGET PRESET ALSO PROVIDES SHELL RECOMMENDATIONS</small></label>
      </div>
      <div class="panel-title"><span>02</span> POSITION DATA</div>
      <div class="grid"><label><span>GUN POSITION <em>OPTIONAL</em></span><div class="coord-grid"><input id="gunLat" type="number" min="-90" max="90" step="0.000001" placeholder="LATITUDE"><input id="gunLon" type="number" min="-180" max="180" step="0.000001" placeholder="LONGITUDE"></div><small>LAT −90…90 // LON −180…180</small></label>
      <label><span>TARGET POSITION <em>OPTIONAL</em></span><div class="coord-grid"><input id="targetLat" type="number" min="-90" max="90" step="0.000001" placeholder="LATITUDE"><input id="targetLon" type="number" min="-180" max="180" step="0.000001" placeholder="LONGITUDE"></div><small>IF BOTH POSITIONS ARE VALID, DISTANCE + BEARING ARE CALCULATED</small></label></div>
      <div class="charge-readout"><div><span>REQUIRED POWDER CHARGES</span><strong id="charges">—</strong></div><div><span>TABLE BAND</span><strong id="band">—</strong></div><div class="hint">ONE CHARGE / 5 KM<br>ROUND UP // MAX 30 KM</div></div>
      <button class="calculate" id="calculate" type="button"><span>CALCULATE</span><b>▶</b></button><div class="error" id="error" aria-live="polite"></div></section>
      <section class="panel settings-panel instrument"><div class="panel-title"><span>03</span> DISPLAY / SYSTEM</div><div class="settings-grid">
        <div class="setting"><label>DISTANCE UNIT</label><select id="distanceUnit"><option value="km" ${settings.distanceUnit==='km'?'selected':''}>KILOMETRES</option><option value="m" ${settings.distanceUnit==='m'?'selected':''}>METRES</option></select></div>
        <div class="setting"><label>ANGLE UNIT</label><select id="angleUnit"><option value="deg" ${settings.angleUnit==='deg'?'selected':''}>DEGREES</option><option value="mil" ${settings.angleUnit==='mil'?'selected':''}>MILS (6400)</option></select></div>
        <div class="setting"><label>DISPLAY MODE</label><div class="mode-buttons"><button data-mode="green" class="${settings.theme==='green'?'active':''}">GREEN</button><button data-mode="night" class="${settings.theme==='night'?'active':''}">NIGHT</button><button data-mode="blackout" class="${settings.theme==='blackout'?'active':''}">BLACKOUT</button></div></div>
        <div class="setting"><label>SCREEN BRIGHTNESS <span id="brightVal">${settings.brightness}%</span></label><input id="brightness" type="range" min="25" max="100" value="${settings.brightness}"></div>
        <div class="setting"><label>POWER</label><label class="toggle"><input id="keepAwake" type="checkbox" ${settings.keepAwake?'checked':''}> KEEP SCREEN AWAKE</label></div>
        <div class="setting"><label>QUICK ACTION</label><button id="repeat" class="preset" type="button" ${history.length?'':'disabled'}>REPEAT LAST SOLUTION</button></div>
      </div></section>
      <section class="panel calibration-panel instrument"><div class="panel-title"><span>04</span> FIRING TABLE CALIBRATION</div>
      <div class="calibration-note">EDIT THE STORED RANGE/ELEVATION REFERENCE POINTS. THE CALCULATOR INTERPOLATES BETWEEN THEM. CHANGES ARE SAVED LOCALLY ON THIS DEVICE.</div>
      <div class="calibration-grid">${calibration.map((p,i)=>`<label><span>${p[0].toFixed(0)} KM</span><input data-cal="${i}" type="number" step="0.01" value="${p[1]}" aria-label="Elevation at ${p[0]} km"></label>`).join('')}</div>
      <div class="calibration-actions"><button id="saveCalibration" type="button">SAVE TABLE</button><button id="resetCalibration" type="button">RESTORE DEFAULT</button><button id="fullscreen" type="button">FULLSCREEN</button></div></section>
      <section class="panel history-panel instrument"><div class="panel-title"><span>06</span> FIRING LOG</div><div class="history-list">${renderHistory()}</div></section>
      <footer>IRON NEST FIELD EQUIPMENT DIVISION <span>//</span> FIRE CONTROL UNIT</footer></main>`;
      document.querySelector('.screen').style.filter=`brightness(${settings.brightness/100})`; bindForm(); keepAwake();
    }
    function renderHistory(){if(!history.length)return '<div style="color:#607b65;font-size:9px">NO STORED SOLUTIONS // LOCAL DEVICE STORAGE</div>';return history.slice(0,8).map((r,i)=>`<div class="history-item"><div><strong>${escapeHtml(r.target)}</strong><span>${fmtDistance(r.distance)} // ${fmtAngle(r.elevation)} // ${r.charges} CHG // ${escapeHtml(r.shellCode)}</span></div><button data-history="${i}">LOAD</button></div>`).join('');}
    function bindForm(){
      const distance=document.querySelector('#distance'),charges=document.querySelector('#charges'),band=document.querySelector('#band'),target=document.querySelector('#target'),preset=document.querySelector('#targetPreset'),shell=document.querySelector('#shell'),rec=document.querySelector('#recommend');
      const gunSide=settings.gunSide||'L'; document.querySelectorAll('[data-gun]').forEach(b=>b.addEventListener('click',()=>{settings.gunSide=b.dataset.gun;saveSettings();document.querySelectorAll('[data-gun]').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#selectedGun').textContent=b.dataset.gun+' GUN';document.querySelector('#rotaryBody').style.setProperty('--rotary-angle',b.dataset.gun==='L'?'-45deg':'45deg');})); document.querySelector('#rotaryBody').style.setProperty('--rotary-angle',gunSide==='L'?'-45deg':'45deg');
      function updateReadout(){const d=Number(distance.value);const km=toKm(d);if(distance.value!==''&&Number.isFinite(km)&&km>=0&&km<=30){const r=calculateElevation(km);charges.textContent=r.charges;band.textContent=r.band}else{charges.textContent='—';band.textContent='—'}}
      distance.addEventListener('input',updateReadout); updateReadout();
      preset.addEventListener('change',()=>{target.value=preset.value;rec.innerHTML='RECOMMENDED: '+shellRecommendation(preset.value)});
      target.addEventListener('input',()=>{rec.innerHTML='RECOMMENDED: '+shellRecommendation(target.value.trim())});
      document.querySelector('#calculate').addEventListener('click',calculate);
      document.querySelector('#repeat')?.addEventListener('click',()=>{if(history[0])renderForm(history[0])});
      document.querySelectorAll('[data-history]').forEach(b=>b.addEventListener('click',()=>renderForm(history[Number(b.dataset.history)])));
      document.querySelector('#distanceUnit').addEventListener('change',e=>{settings.distanceUnit=e.target.value;saveSettings();renderForm()});
      document.querySelector('#angleUnit').addEventListener('change',e=>{settings.angleUnit=e.target.value;saveSettings();renderForm()});
      document.querySelector('#brightness').addEventListener('input',e=>{settings.brightness=Number(e.target.value);document.querySelector('#brightVal').textContent=settings.brightness+'%';document.querySelector('.screen').style.filter=`brightness(${settings.brightness/100})`;saveSettings()});
      document.querySelector('#keepAwake').addEventListener('change',e=>{settings.keepAwake=e.target.checked;saveSettings();if(settings.keepAwake)keepAwake()});
      document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{settings.theme=b.dataset.mode;saveSettings();renderForm()}));
      document.querySelector('#saveCalibration').addEventListener('click',()=>{
        const vals=[...document.querySelectorAll('[data-cal]')].map((el,i)=>Number(el.value));
        if(vals.some(v=>!Number.isFinite(v))){alert('Calibration values must be numbers.');return;}
        calibration=calibration.map((p,i)=>[p[0],vals[i]]);
        localStorage.setItem('ironNestCalibration',JSON.stringify(calibration));
        renderForm();
      });
      document.querySelector('#resetCalibration').addEventListener('click',()=>{
        calibration=DEFAULT_POINTS.map(x=>x.slice());localStorage.setItem('ironNestCalibration',JSON.stringify(calibration));renderForm();
      });
      document.querySelector('#fullscreen').addEventListener('click',async()=>{
        try{if(!document.fullscreenElement) await document.documentElement.requestFullscreen(); else await document.exitFullscreen();}catch(e){}
      });
    }
    function calculate(){
      const error=document.querySelector('#error');const dInput=document.querySelector('#distance').value;const d=toKm(Number(dInput));
      if(dInput===''||!Number.isFinite(d)||d<0||d>30){error.textContent='ERROR // ENTER A DISTANCE BETWEEN 0 AND 30 KM.';return;}
      const gun=parseCoords('gun'),tar=parseCoords('target');let distance=d,bearing=Number(document.querySelector('#bearing').value);
      if((gun&&!tar)||(!gun&&tar)){error.textContent='ERROR // ENTER BOTH GUN AND TARGET COORDINATES.';return}
      if(gun&&tar){distance=haversine(gun.lat,gun.lon,tar.lat,tar.lon);bearing=bearingBetween(gun.lat,gun.lon,tar.lat,tar.lon);}
      if(!Number.isFinite(bearing))bearing=null; if(bearing!==null)bearing=(bearing+360)%360;
      const shellCode=document.querySelector('#shell').value,shellName=SHELLS.find(s=>s[0]===shellCode)?.[1]||shellCode,target=document.querySelector('#target').value.trim()||'UNSPECIFIED';const r=calculateElevation(distance);
      lastResult={distance,bearing,shellCode,shellName,target,...r,gun,tar,gunSide:settings.gunSide||'L'};
      history.unshift(lastResult);history=history.slice(0,20);localStorage.setItem('ironNestHistory',JSON.stringify(history));renderResult(lastResult);
    }
    function renderResult(r){
      clearTimeout(revealTimer);applyTheme();const bearing=r.bearing===null?'—':r.bearing.toFixed(1)+'°';
      document.querySelector('#app').innerHTML=`<main class="screen result-screen fade-in"><div class="scanlines"></div><div class="result-actions hidden" id="actions"><button id="reset">RESET</button><button id="back">◀ BACK</button><button id="repeatNow">REPEAT</button><button id="save">SAVE IMAGE</button></div>
      <header class="result-head"><div class="crest">IRON<br><span>NEST</span></div><div><div class="eyebrow">FIRE CONTROL OUTPUT // VERIFIED</div><h1>FIRING SOLUTION</h1><p style="margin:3px 0;color:#7d8e7a;font-size:10px;letter-spacing:2px">GUN ${escapeHtml(r.gunSide||'L')} // TWIN BATTERY</p></div><div class="status live"><i></i> SOLUTION LOCKED</div></header>
      <section class="solution-card instrument"><div class="solution-label">GUN ELEVATION</div><div class="gauge"><div class="gauge-needle" id="needle"></div><div class="gauge-center"></div></div><div class="angle"><span id="angleValue">0</span><small>${settings.angleUnit==='mil'?'MIL':'DEG'}</small></div><div class="rule"></div><div class="formula">TABLE BAND <b>${escapeHtml(r.band)}</b> // ${r.charges} POWDER CHARGE${r.charges===1?'':'S'}</div></section>
      <section class="data-card instrument"><div class="panel-title"><span>05</span> FIRING DATA</div><div class="data-grid"><div><span>DISTANCE</span><strong>${fmtDistance(r.distance)}</strong></div><div><span>POWDER CHARGES</span><strong>${r.charges}</strong></div><div><span>BEARING</span><strong>${escapeHtml(bearing)}</strong></div><div><span>GUN</span><strong>${escapeHtml(r.gunSide||'L')} GUN</strong><small>TWIN MOUNT // FIRE CONTROL</small></div><div><span>ORDNANCE</span><strong>${escapeHtml(r.shellCode)}</strong><small>${escapeHtml(r.shellName)}</small></div><div class="wide"><span>TARGET</span><strong>${escapeHtml(r.target)}</strong></div>${r.gun&&r.tar?`<div class="wide"><span>POSITION SOLUTION</span><small>GUN ${r.gun.lat.toFixed(5)}, ${r.gun.lon.toFixed(5)} → TARGET ${r.tar.lat.toFixed(5)}, ${r.tar.lon.toFixed(5)}</small></div>`:''}</div></section>
      <div class="warning">⚠ VERIFY BEARING, CHARGE COUNT AND TARGET IDENTIFICATION BEFORE FIRING.</div><footer>UNOFFICIAL IRON NEST FIELD EQUIPMENT DIVISION <span>//</span> FIRE CONTROL UNIT</footer></main>`;
      document.querySelector('.screen').style.filter=`brightness(${settings.brightness/100})`;
      const angleValue=document.querySelector('#angleValue'),needle=document.querySelector('#needle'),targetAngle=r.elevation,targetMils=degToMils(targetAngle);const start=performance.now(),duration=900;
      function animate(now){const t=Math.min(1,(now-start)/duration),eased=1-Math.pow(1-t,3);angleValue.textContent=settings.angleUnit==='mil'?(targetMils*eased).toFixed(0): (targetAngle*eased).toFixed(2);needle.style.transform=`translate(-50%,-100%) rotate(${targetAngle*1.5*eased-112.5}deg)`;if(t<1)requestAnimationFrame(animate)}requestAnimationFrame(animate);
      revealTimer=setTimeout(()=>document.querySelector('#actions')?.classList.remove('hidden'),10000);
      document.querySelector('#reset').onclick=()=>renderForm();document.querySelector('#back').onclick=()=>renderForm(r);document.querySelector('#repeatNow').onclick=()=>renderForm(r);document.querySelector('#save').onclick=saveResultImage;keepAwake();
    }
    function saveResultImage(){
      const r=lastResult;if(!r)return;
      const scale=2,w=1400,h=980,c=document.createElement('canvas');c.width=w*scale;c.height=h*scale;
      const x=c.getContext('2d');x.scale(scale,scale);
      const grad=x.createLinearGradient(0,0,w,h);grad.addColorStop(0,'#26362b');grad.addColorStop(1,'#080c09');x.fillStyle=grad;x.fillRect(0,0,w,h);
      x.strokeStyle='#657665';x.lineWidth=4;x.strokeRect(24,24,w-48,h-48);x.strokeStyle='#26392c';x.lineWidth=2;x.strokeRect(36,36,w-72,h-72);
      x.fillStyle='#bdcdb8';x.font='bold 34px monospace';x.fillText('IRON NEST // FIRE CONTROL CONSOLE',70,90);
      x.fillStyle='#829681';x.font='17px monospace';x.fillText(`TWIN BATTERY // GUN ${r.gunSide||'L'} // SOLUTION VERIFIED`,70,122);
      x.fillStyle='#dbe6d6';x.font='bold 110px monospace';x.fillText(rawAngle(r.elevation)+(settings.angleUnit==='mil'?' MIL':'°'),70,285);
      x.fillStyle='#829681';x.font='18px monospace';x.fillText('GUN ELEVATION',76,320);
      x.strokeStyle='#536756';x.beginPath();x.moveTo(70,350);x.lineTo(1330,350);x.stroke();
      x.fillStyle='#c1d0bc';x.font='22px monospace';
      const lines=[`SELECTED GUN   ${r.gunSide||'L'} GUN`,`DISTANCE       ${fmtDistance(r.distance)}`,`POWDER CHARGES ${r.charges}`,`BEARING        ${r.bearing===null?'—':r.bearing.toFixed(1)+'°'}`,`ORDNANCE       ${r.shellCode}`,`TARGET         ${r.target}`];
      lines.forEach((line,i)=>x.fillText(line,76,410+i*55));
      x.fillStyle='#708371';x.font='16px monospace';x.fillText('TABLE: '+r.band+' // VERIFY BEFORE FIRING',76,790);x.fillText('IRON NEST FIELD EQUIPMENT DIVISION',76,845);x.fillText(new Date().toLocaleString(),76,875);
      const dataUrl=c.toDataURL('image/png'); const filename=`iron-nest-${r.gunSide||'L'}-${r.distance.toFixed(2)}km.png`;
      try{
        if(window.Android && typeof window.Android.saveImage==='function'){window.Android.saveImage(dataUrl,filename);return;}
      }catch(e){console.error(e)}
      try{
        const a=document.createElement('a');a.download=filename;a.href=dataUrl;document.body.appendChild(a);a.click();a.remove();
        setTimeout(()=>alert('IMAGE CREATED. If your browser did not download it automatically, use the browser share/save option.'),250);
      }catch(e){
        if(navigator.share){fetch(dataUrl).then(res=>res.blob()).then(blob=>navigator.share({title:'IRON NEST Firing Solution',files:[new File([blob],filename,{type:'image/png'})]})).catch(()=>alert('Unable to save image on this device.'))}
        else alert('Unable to save image on this device.');
      }
    }
    applyTheme();renderForm();
</script>
